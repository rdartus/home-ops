deploymentStrategy:
  type: Recreate
# admin:
#   existingSecret: grafana-admin-secret
env:
  GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
  GF_EXPLORE_ENABLED: true
  GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
  GF_SECURITY_ANGULAR_SUPPORT_ENABLED: true
  GF_SERVER_ROOT_URL: https://grafana.dartus.fr
  GF_NEWS_NEWS_FEED_ENABLED: false
envFromSecret: "grafana-secret"
envValueFrom:
  GF_SMTP_USER:
    secretKeyRef:
      name: smtp-secret
      key: gmail_username
  GF_SMTP_FROM_ADDRESS:
    secretKeyRef:
      name: smtp-secret
      key: gmail_username
  GF_SMTP_PASSWORD:
    secretKeyRef:
      name: smtp-secret
      key: gmail_password
grafana.ini:
  analytics:
    check_for_updates: false
    check_for_plugin_updates: false
    reporting_enabled: false
  smtp:
    enabled: true
    host: smtp.gmail.com:465
  auth.anonymous:
    enabled: false
  auth.generic_oauth:
    enabled: true
    name: Athentik
    allow_sign_up: true
    scopes: openid email profile offline_access roles
    email_attribute_path: email
    login_attribute_path: username
    name_attribute_path: full_name
    auto_login: true 
    auth_url: https://authentik.dartus.fr/application/o/authorize/
    token_url: https://authentik.dartus.fr/application/o/token/
    api_url: https://authentik.dartus.fr/application/o/userinfo/
    signout_redirect_url: https://authentik.dartus.fr/application/o/grafana/end-session/
    role_attribute_path: contains(groups, 'authentik Admins') && 'Admin' || contains(groups, 'Pirates') && 'Editor' || 'Viewer'
  news:
    news_feed_enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - { name: Alertmanager, orgId: 1 }
      - { name: Loki, orgId: 1 }
      - { name: Prometheus, orgId: 1 }
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://kube-prometeus-stack-kube-prometheus.observability.svc.cluster.local:9090
        isDefault: true
      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        access: proxy
        url: http://kube-prometeus-stack-kube-alertmanager.observability.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
