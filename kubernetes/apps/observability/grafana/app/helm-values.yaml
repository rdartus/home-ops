sidecar:
  image:
    registry: ghcr.io
    repository: home-operations/k8s-sidecar
    tag: 2.10.3@sha256:f847e4472fde29287ebc8131f9576e0676ed050f92cc0a461a98cb215a1f84fe
  dashboards:
    enabled: true
    searchNamespace: ALL
    label: grafana_dashboard
    folderAnnotation: grafana_folder
    provider:
      disableDelete: true
      foldersFromFilesStructure: true
  datasources:
    enabled: true
    searchNamespace: ALL
    labelValue: ""
plugins:
  - grafana-clock-panel
  - grafana-piechart-panel
  - grafana-worldmap-panel
  - natel-discrete-panel
  - pr0ps-trackmap-panel
  - vonage-status-panel
serviceMonitor:
  enabled: true
ingress:
  enabled: true
  ingressClassName: traefik-ingresses
  annotations:
    hajimari.io/enable: "true"
    hajimari.io/group: "Media"
    hajimari.io/icon: "bookshelf"
    hajimari.io/appName: "grafana"
    cert-manager.io/cluster-issuer: zerossl-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
  path: /
  pathType: Prefix
  hosts:
    - grafana.dartus.fr
  tls:
   - secretName: grafana.dartus.fr-tls
     hosts:
       - grafana.dartus.fr
persistence:
  enabled: false
testFramework:
  enabled: false
## Configure grafana alerting (can be templated)
## ref: https://docs.grafana.com/alerting/set-up/provision-alerting-resources/file-provisioning/
##
alerting: 
  contactpoints.yaml:
    secret:
      apiVersion: 1
      contactPoints:
          - orgId: 1
            name: grafana-default-email
            receivers:
              - uid: ff1qoq8xf239cd
                type: email
                settings:
                  addresses: richard.dartus@gmail.com
                  singleEmail: false
                disableResolveMessage: false