---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-local-path-usage        # ex: grafana-dashboard-k8s-nodes
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    # grafana_folder: "kubernetes"          # ex: Kubernetes
data:
  local-path-usage.json: |
    {
      "title": "Local-path — usage réel vs déclaré",
      "uid": "local-path-usage",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "",
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "tags": ["storage", "local-path"],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Usage réel / taille déclarée par PVC (local-path)",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "orange", "value": 2 },
                  { "color": "red", "value": 3 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(kubelet_volume_stats_used_bytes / on(namespace, persistentvolumeclaim) kube_persistentvolumeclaim_resource_requests_storage_bytes) * on(namespace, persistentvolumeclaim) group_left(storageclass) kube_persistentvolumeclaim_info{storageclass=\"local-path\"}",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
            }
          ]
        }
      ]
    }