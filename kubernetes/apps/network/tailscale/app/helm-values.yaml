# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---

controllers:
  vpn:
    type: statefulset
    replicas: 1
    pod:
      # Par défaut app-template désactive le montage du token SA :
      # il faut le réactiver pour que containerboot puisse patcher son Secret.
      automountServiceAccountToken: true
      # ADAPT si le nom du ServiceAccount généré diffère — voir note de
      # validation plus bas.
    containers:
      vpn:
        image:
          repository: ghcr.io/tailscale/tailscale
          # ADAPT: pin to the current stable release, check
          # https://github.com/tailscale/tailscale/releases
          tag: "v1.102.2"
        env:
          POD_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          TS_KUBE_SECRET: "tailscale-state"
          TS_AUTHKEY:
            valueFrom:
              secretKeyRef:
                # ADAPT: create this Secret yourself (SOPS/Vault, same as
                # headplane-secret.yaml) with a reusable, non-ephemeral
                # pre-auth key:
                #   kubectl exec -n headscale statefulset/headscale -- \
                #     headscale preauthkeys create --reusable --expiration 8760h
                name: scale-secret
                key: tailscale_key
          TS_EXTRA_ARGS: >-
            --login-server=https://tailscale.dartus.fr
            --advertise-exit-node
            --advertise-routes=192.168.1.0/24,10.96.0.0/12,10.244.0.0/16
            --accept-routes
          # your Service CIDR and Pod CIDR respectively - use the real
          # ones from your Talos machine config 
          #  kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.podCIDR}{"\n"}{end}'
          #  kubectl cluster-info dump | grep -m1 service-cluster-ip-range
          # TS_STATE_DIR: /var/lib/tailscale
          TS_USERSPACE: "false"
          TS_ACCEPT_DNS: "false"
          TS_HOSTNAME: "vpn-home"
          TS_DEBUG_FIREWALL_MODE: "nftables"
          TS_AUTH_ONCE: "true"
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi

    # pod:
    #   # Required for IP forwarding to actually route traffic between the
    #   # tailnet and 192.168.1.0/24 / the cluster networks, not just
    #   # advertise it.
    #   securityContext:
    #     sysctls:
    #       - name: net.ipv4.ip_forward
    #         value: "1"
    #       - name: net.ipv6.conf.all.forwarding
    #         value: "1"
# 1. Définition du Service Account sous forme de dictionnaire
serviceAccount:
  vpn: {}

rbac:
  # 2. Définition du Role sous forme de dictionnaire
  roles:
    vpn:
      type: Role
      rules:
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "update", "patch"]
          resourceNames: ["tailscale-state"]
  
  # 3. Utilisation de "bindings" (et non roleBindings)
  bindings:
    vpn:
      type: RoleBinding
      roleRef:
        # Pointeur vers la clé "vpn" du dictionnaire rbac.roles
        identifier: vpn
      subjects:
        # Pointeur vers la clé "vpn" du dictionnaire serviceAccount
        - identifier: vpn

persistence:
  # This is the actual /dev/net/tun character device from the host - it's
  # what lets the container create a real TUN interface instead of
  # userspace networking. Straight from app-template's own docs example.
  dev-tun:
    type: hostPath
    hostPath: /dev/net/tun
    hostPathType: CharDevice
 
 #   # Node identity/state must survive restarts, or the router re-registers
#   # as a brand new node (and needs re-approval) every time the Pod
#   # reschedules.
#   state:
#     enabled: true
#     type: persistentVolumeClaim
#     existingClaim: pvc-tailscale
