apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: tailscale-state-backup
  namespace: network   # ADAPT — voir remarque namespace plus bas
spec:
  refreshInterval: 1h   # une clé privée ne tourne pas toutes les 30s,
                         # pas besoin de matraquer Vault en continu
  secretStoreRefs:
    - name: vault-backend   # ADAPT: votre SecretStore ESO existant, ou à créer
      kind: SecretStore
  selector:
    secret:
      name: tailscale-state   # le Secret que tailscaled possède réellement
  data:
    - match:
        secretKey: "_current-profile"
        remoteRef:
          remoteKey: scale/state
          property: _current-profile
    - match:
        secretKey: "_machinekey"
        remoteRef:
          remoteKey: scale/state
          property: _machinekey
    - match:
        secretKey: "_profiles"
        remoteRef:
          remoteKey: scale/state
          property: _profiles
    - match:
        secretKey: "device_fqdn"
        remoteRef:
          remoteKey: scale/state
          property: device_fqdn
    - match:
        secretKey: "device_id"
        remoteRef:
          remoteKey: scale/state
          property: device_id
    - match:
        secretKey: "device_ips"
        remoteRef:
          remoteKey: scale/state
          property: device_ips
    - match:
        secretKey: "profile-2253"
        remoteRef:
          remoteKey: scale/state
          property: profile-2253
    - match:
        secretKey: "tailscale_capver"
        remoteRef:
          remoteKey: scale/state
          property: tailscale_capver