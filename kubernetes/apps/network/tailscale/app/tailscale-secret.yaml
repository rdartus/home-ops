apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-tailscale-secret
  namespace: network
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "10"
spec:
  type: kv-v2
  # Même point de montage et chemin que ton secret principal
  mount: kv-v2
  path: scale/config

  destination:
    # Nom du nouveau secret Kubernetes qui sera créé
    name: vpn-0
    create: true
    # Le bloc transformation permet de filtrer et mapper les clés
    transformation:
      templates:
        # Clé dans le secret k8s : Valeur extraite du secret Vault
        tailscale_state:
          text: '{{ get .Secrets "tailscale_state" }}'

  refreshAfter: 30s
  vaultAuthRef: scale-auth

  # Optionnel : Ajoute ici les workloads à redémarrer si la clé change
  rolloutRestartTargets:
    - kind: statefulset
      name: vpn