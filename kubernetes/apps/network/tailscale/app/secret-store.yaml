apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: network
spec:
  provider:
    vault:
      server: "https://vault.dartus.fr"   # ADAPT: votre endpoint Vault réel
      path: "kv-v2"                        # même mount que scale/state
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"           # ADAPT: reprenez le mountPath
                                             # déjà utilisé par scale-auth
                                             # (vault auth list pour vérifier)
          role: "rleso-tailscale"
          serviceAccountRef:
            name: tailscale-eso  # ADAPT au nom réel vérifié étape 2