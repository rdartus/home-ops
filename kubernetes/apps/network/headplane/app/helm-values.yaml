# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---

  values:
    controllers:
      headplane:
        type: statefulset
        replicas: 1
        containers:
          headplane:
            image:
              repository: ghcr.io/tale/headplane
              # ADAPT: pin to the current release, check
              # https://github.com/tale/headplane/releases
              tag: "0.7.0"
            env:
              # Required for any HEADPLANE_<SECTION>__<KEY> override below
              # to actually be picked up.
              HEADPLANE_LOAD_ENV_OVERRIDES: "true"
              HEADPLANE_SERVER__COOKIE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: scale-secret
                    key: cookie
              HEADPLANE_HEADSCALE__API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: scale-secret
                    key: headscale_api_key
              HEADPLANE_OIDC__CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: scale-secret
                    key: client_id
              HEADPLANE_OIDC__CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: scale-secret
                    key: client_secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /admin/login
                    port: 3000
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /admin/login
                    port: 3000
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
 
    service:
      headplane:
        controller: headplane
        ports:
          http:
            port: 3000
 
    ingress:
      headplane:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: zerossl-issuer
        hosts:
          - host: &host headplane.dartus.fr
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: headplane
                  port: http
        tls:
          - hosts:
              - *host
            secretName: headplane-tls
 
    persistence:
      # Session store / internal DB / agent cache. Small, but worth
      # persisting so logging back in isn't required after every restart.
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 256Mi
        globalMounts:
          - path: /var/lib/headplane
 
      # Read-only view of headscale's own config, so Headplane can show it
      # in the UI (see headplane-configmap.yaml's headscale.config_path).
      headscale-config:
        type: configMap
        name: headscale-config
        globalMounts:
          - path: /etc/headscale/config.yaml
            subPath: config.yaml
            readOnly: true
 
      config:
        type: configMap
        name: headplane-config
        globalMounts:
          - path: /etc/headplane/config.yaml
            subPath: config.yaml
            readOnly: true
 
      secrets:
        type: secret
        name: scale-secret
        globalMounts:
          - path: /etc/headplane/secrets
            readOnly: true
 