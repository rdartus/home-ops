---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./upsnap-auth.yaml
  - ./upsnap-secret.yaml
  - ./upsnap-admin-secret.yaml
  - ./pvc-upsnap.yaml

configMapGenerator:
  - name: upsnap-helm-values
    files:
      - values.yaml=./helm-values.yaml
configurations:
  - kustomizeconfig.yaml
