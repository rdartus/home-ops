apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-scale
  namespace: network
  

spec:
  type: kv-v2

  # mount path
  mount: kv-v2

  # path of the secret
  path: scale/config

  # dest k8s secret
  destination:
    name: scale-secret
    create: true

  # static secret refresh interval
  refreshAfter: 30s

  # Name of the CRD to authenticate to Vault
  vaultAuthRef: scale-auth

  rolloutRestartTargets:
    - kind: StatefulSet
      name: headscale
    - kind: StatefulSet
      name: headplane
    - kind: Deployment
      name: tailscale
 