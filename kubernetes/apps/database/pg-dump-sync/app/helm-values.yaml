# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---
controllers:
  main:
    enabled: true
    type: cronjob
    cronjob:
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 900
      successfulJobsHistory: 1
      failedJobsHistory: 3
      schedule: "20 * * * *"
    containers:
      main:
        dependsOn: []
        image:
          repository: postgres
          tag: 18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
          # -- image pull policy
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            mkdir -p /nas
            find /nas -maxdepth 1 -type f -name '.dump_*.tmp' -delete
            found=0
            for source in /db/dump_*; do
              [ -f "$source" ] || continue
              found=1
              name=${source##*/}
              temporary="/nas/.${name}.tmp"
              target="/nas/${name}"
              rm -f "$temporary"
              cp "$source" "$temporary"
              mv -f "$temporary" "$target"
            done
            find /nas -maxdepth 1 -type f -name 'dump_*' -mtime +30 -delete
            [ "$found" -eq 1 ]

  publisher:
    # Publish the completed hourly dump set once per day, after the midnight dump.
    enabled: true
    type: cronjob
    cronjob:
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 900
      successfulJobsHistory: 1
      failedJobsHistory: 3
      schedule: "30 0 * * *"
    containers:
      main:
        image:
          repository: ghcr.io/rdartus/git-sync@sha256
          tag: 1e73176654edc824de658a270582edd815ac7cb4bae06de96d8aadaebc900ac9
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            export HOME=/work/home
            repository="git@gitlab.com:k3s-pi1/dump-k3s.git"
            worktree=/work/repo
            rm -rf "$worktree"
            mkdir -p "$HOME"
            export GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/config/known_hosts -i /config/key'

            git config --global user.name "home-ops backup"
            git config --global user.email "home-ops-backup@noreply.invalid"
            git clone --branch main --single-branch "$repository" "$worktree"
            cd "$worktree"
            git lfs pull
            main_sha=$(git rev-parse HEAD)
            git fetch origin refs/heads/previous:refs/remotes/origin/previous 2>/dev/null || true
            previous_sha=$(git rev-parse refs/remotes/origin/previous 2>/dev/null || true)
            git lfs track 'dump_*'

            find . -maxdepth 1 -type f -name 'dump_*' -delete
            found=0
            for source in /db/dump_*; do
              [ -f "$source" ] || continue
              found=1
              name=${source##*/}
              cp "$source" "./.${name}.tmp"
              mv "./.${name}.tmp" "./${name}"
            done
            [ "$found" -eq 1 ]

            git add -A -- .
            changed=0
            if [ -n "$(git status --porcelain)" ]; then
              changed=1
              git commit -m "Publish PostgreSQL dumps"
            fi

            if [ "$changed" -eq 1 ]; then
              git lfs push origin HEAD
            fi

            if [ "$(date +%d)" = "01" ]; then
              git push origin "$main_sha:refs/heads/previous" \
                --force-with-lease="refs/heads/previous:${previous_sha}"
            fi

            if [ "$changed" -eq 1 ]; then
              git push origin HEAD:refs/heads/main
            fi


  sync:
    # Publish the completed hourly dump set once per day, after the midnight dump.
    enabled: true
    type: cronjob
    cronjob:
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 900
      successfulJobsHistory: 1
      failedJobsHistory: 3
      schedule: "30 0 * * *"
    containers:
      gitsync:
        dependsOn: []
        image:
          repository: ghcr.io/rdartus/git-sync
          tag: latest@sha256:4d002b01767e44a2e8727b1680f983cafe2e886f24b2c006844f8ba8cae10c9a
          # -- image pull policy
          pullPolicy: IfNotPresent
        args: 
          - --repo=git@gitlab.com:k3s-pi1/dump-k3s.git
          - --depth=1
          - --period=1500s
          - --link=dump-k3s
          - --ref=main
          - --root=/data
          - --ssh-known-hosts=false
          - --git-config-add=safe.directory=/data
          - --ssh-key-file=/config/key
          - --git-lfs=true
          - --verbose=9
          - --exechook-timeout=300s
          - --sync-timeout=300s
          - --one-time

persistence:
  db:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: pvc-db-tmp
  nas:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: pvc-db-backups
    globalMounts:
      - path: /nas
  config:
    enabled: true
    type: secret
    name: ssh-secret
    globalMounts:
      - path: /config
  work:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /work
  data :
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /data