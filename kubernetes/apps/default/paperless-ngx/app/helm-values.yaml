# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---
controllers:
  main:
    # -- enable the controller.
    enabled: true

    # -- Set the controller type.
    # Valid options are deployment, daemonset, statefulset, cronjob or job
    type: statefulset
    containers:
      main:
        # -- Override the container name
        # nameOverride:

        # -- Specify if this container depends on any other containers
        # This is used to determine the order in which the containers are rendered.

        image:
          # -- image repository
          repository: ghcr.io/paperless-ngx/paperless-ngx
          # -- image tag
          tag: 3.3.3@sha256:dba0242c1df1843643df4eb50ce5639f3a7900f414879088fd5bed8eaf2d456d
          # -- image pull policy
          pullPolicy: IfNotPresent
        dependsOn: [tika, gotenberg]
        env:
          PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
          PAPERLESS_TIKA_ENDPOINT: http://tika:9998
          PAPERLESS_URL : https://scan.dartus.fr
          PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
          PAPERLESS_REDIS:
            valueFrom:
              secretKeyRef:
                name: paperless-redis-secret
                key: REDIS_URL

          PAPERLESS_DBHOST: cnpg-cluster-rw.database.svc.cluster.local
          PAPERLESS_DBENGINE: postgresql
          PAPERLESS_DBNAME: paperless
          PAPERLESS_DBUSER: 
            valueFrom:
              secretKeyRef:
                name: paperless-db-secret
                key: username
          PAPERLESS_DBPASS: 
              valueFrom:
                secretKeyRef:
                  name: paperless-db-secret
                  key: password
          PAPERLESS_CONSUMER_DISABLE: true
          PAPERLESS_OCR_PAGES: 1
          PAPERLESS_APP_TITLE: jeanscan
          PAPERLESS_WEBSERVER_WORKERS: 1
          PAPERLESS_OCR_CLEAN: none
          PAPERLESS_ENABLE_ALLAUTH: true
          PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: false
          PAPERLESS_SOCIAL_AUTO_SIGNUP: true
          PAPERLESS_AUTO_LOGIN: true
          PAPERLESS_AUTO_CREATE: true
          PAPERLESS_SOCIALACCOUNT_PROVIDERS: 
            valueFrom:
              secretKeyRef:
                name: paperless-app-secret
                key: oidcProvider
          PAPERLESS_GMAIL_OAUTH_CLIENT_ID: 
            valueFrom:
              secretKeyRef:
                name: paperless-app-secret
                key: gmailOidcClient
          PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET: 
            valueFrom:
              secretKeyRef:
                name: paperless-app-secret
                key: gmailOidcSecret
          PAPERLESS_SECRET_KEY:
            valueFrom:
              secretKeyRef:
                name: paperless-app-secret
                key: encryption_key
      gotenberg:
        image: 
          repository: docker.io/gotenberg/gotenberg
          tag: 8.38@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
          # -- image pull policy
          pullPolicy: IfNotPresent

        # The gotenberg chromium route is used to convert .eml files. We do not
        # want to allow external content like tracking pixels or even javascript.
        command:
          - "gotenberg"
          - "--chromium-disable-javascript=true"
          - "--chromium-allow-list=file:///tmp/.*"
      tika:
        image: 
          repository: docker.io/apache/tika
          tag: 3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
          # -- image pull policy
          pullPolicy: IfNotPresent
# -- If true forces the controllers to use the `default` ServiceAccount for the namespace if one is not explicitly defined.
# This feature flag will be removed on future versions where this will be the default behavior.
enforceServiceAccountCreation: false
service:
  main:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 8000
        protocol: HTTP

# -- Configure the ingresses for the chart here.
ingress:
  main:
    enabled: true
    annotations:
      hajimari.io/enable: "true"
      hajimari.io/group: "Media"
      hajimari.io/icon: "bookshelf"
      hajimari.io/appName: "livres"
      cert-manager.io/cluster-issuer: zerossl-prod
      # traefik.ingress.kubernetes.io/router.middlewares: network-crowdsec@kubernetescrd
      acme.cert-manager.io/http01-edit-in-place: "true"

    hosts:
      -  # -- Host address. Helm template can be passed.
        host: scan.dartus.fr
        paths:
          -  # -- Path.  Helm template can be passed.
            path: /
            pathType: Prefix
            service:
              identifier: main
              port: http              

    tls:
      - hosts:
        - scan.dartus.fr
        secretName: scan.dartus.fr-tls

persistence:

  paperless-db:
    enabled: true
    type : persistentVolumeClaim
    existingClaim: pvc-paperless-db
    globalMounts:
      - path: /usr/src/paperless/data
        readOnly: false

  paperless-media:
    enabled: true
    type : persistentVolumeClaim
    existingClaim: pvc-paperless-media
    globalMounts:
      - path: /usr/src/paperless/media
        readOnly: false
