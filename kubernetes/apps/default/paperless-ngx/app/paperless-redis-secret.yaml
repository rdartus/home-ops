# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/secrets.hashicorp.com/vaultstaticsecret_v1beta1.json
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: paperless-redis-secret
  namespace: default
  

spec:
  type: kv-v2

  # mount path
  mount: kv-v2

  # path of the secret
  path: redis/config

  # dest k8s secret
  destination:
    name: paperless-redis-secret
    create: true
    transformation:
        excludeRaw: true   # Empêche l'inclusion des champs bruts de Vault
        excludes:
          - ".*"           # Exclut explicitement tous les champs natifs du secret source
        templates:
          REDIS_URL:
            text: "redis://:{{ .Secrets.password | urlquery }}@valkey.default.svc.cluster.local:6379/4"

  # static secret refresh interval
  refreshAfter: 30s

  # Name of the CRD to authenticate to Vault
  vaultAuthRef: paperless-auth
  rolloutRestartTargets:
      - kind: StatefulSet
        name: paperless