# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---

controllers:
  main:
    # -- enable the controller.
    enabled: true

    # -- Set the controller type.
    # Valid options are deployment, daemonset, statefulset, cronjob or job
    type: statefulset
    containers:
      main:
        # -- Override the container name
        # nameOverride:

        # -- Specify if this container depends on any other containers
        # This is used to determine the order in which the containers are rendered.
        dependsOn: []

        image:
          # -- image repository
          repository: linuxserver/calibre-web
          # -- image tag
          tag: 0.6.27@sha256:8eabbc9ac4d7fcbc252434493078ba22e4e8c3aa461e11b102020b040c5fc3e6
          # -- image pull policy
          pullPolicy: IfNotPresent

        env:
          # -- Set the container timezone
          TZ: UTC
          # -- Specify the user ID the application will run as
          PUID: "1001"
          # -- Specify the group ID the application will run as
          PGID: "1001"



service:
  main:
    # -- Enables or disables the service
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 8083
        protocol: HTTP

ingress:
  main:
    enabled: true
    annotations:
      hajimari.io/enable: "true"
      hajimari.io/group: "Media"
      hajimari.io/icon: "bookshelf"
      hajimari.io/appName: "livres"
      traefik.ingress.kubernetes.io/router.middlewares: "network-authentik-forward-auth@kubernetescrd"
      cert-manager.io/cluster-issuer: zerossl-prod
      # traefik.ingress.kubernetes.io/router.middlewares: network-crowdsec@kubernetescrd
      acme.cert-manager.io/http01-edit-in-place: "false"

    hosts:
      -  # -- Host address. Helm template can be passed.
        host: livres.dartus.fr
        paths:
          -  # -- Path.  Helm template can be passed.
            path: /
            pathType: Prefix
            service:
              identifier: main
              port: http              

    tls:
      - hosts:
        - livres.dartus.fr
        secretName: livres.dartus.fr-tls

persistence: 
  loisir:
    enabled: true
    type : persistentVolumeClaim
    existingClaim: pvc-jeantasse-loisir
    globalMounts:
      - path: /books
        subPath: Books/Calibre-FR
        readOnly: false  
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: pvc-livres-conf