# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/secrets.hashicorp.com/vaultstaticsecret_v1beta1.json
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: coder-app-secret
  namespace: default
  

spec:
  type: kv-v2

  # mount path
  mount: kv-v2

  # path of the secret
  path: coder

  # dest k8s secret
  destination:
    name: coder-app-secret
    create: true

  # static secret refresh interval
  refreshAfter: 30s

  # Name of the CRD to authenticate to Vault
  vaultAuthRef: coder-auth