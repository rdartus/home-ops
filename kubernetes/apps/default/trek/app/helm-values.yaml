# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---

controllers:
  trek:
    replicas: 1
    type: statefulset
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: mauriceboe/trek
          tag: 4.3.3

        env:
          NODE_ENV: production
          PORT: 3000
          ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: trek-config
                key: encryption_key
          TZ: Europe/Paris
          LOG_LEVEL: info
          APP_URL: https://trek.dartus.fr
          OIDC_ISSUER: https://authentik.dartus.fr/application/o/trek/
          OIDC_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: trek-config
                key: client_id
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: trek-config
                key: client_secret
          OIDC_DISPLAY_NAME: Authentik
          OIDC_ONLY: true
          OIDC_ADMIN_CLAIM: groups
          OIDC_ADMIN_VALUE: authentik Admins
          OIDC_SCOPE: openid email profile groups

        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: &port 3000
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: *port
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

service:
  app:
    controller: trek
    ports:
      http:
        port: 3000

ingress:
  app:
    className: traefik-ingresses
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: zerossl-prod
    hosts:
      - host: trek.dartus.fr
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - secretName: trek-tls
        hosts:
          - trek.dartus.fr

persistence:
  data:
    type: persistentVolumeClaim
    existingClaim: pvc-trek
    advancedMounts:
      trek:
        app:
          - path: /app/data
  uploads:
    type: persistentVolumeClaim
    existingClaim: pvc-trek-uploads
    advancedMounts:
      trek:
        app:
          - path: /app/uploads