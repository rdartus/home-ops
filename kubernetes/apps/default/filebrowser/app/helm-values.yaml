# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---
# -- Set default options for all controllers / pods here
# Each of these options can be overridden on a Controller level
defaultPodOptions:
  securityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000
  affinity: 
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchFields:
          - key: metadata.name
            operator: In
            values:
            - nucoumouk
controllers:
  main:
    enabled: true
    type: deployment
    containers:
      main:
        image:
          repository: ghcr.io/gtsteffaniak/filebrowser
          tag: 2.0-stable@sha256:de2b4c4d18485ea202ab2cdada5bd25d8f0b8ed071712c8216a67194c31285ae
          pullPolicy: IfNotPresent
        env:
          FILEBROWSER_CONFIG: "/config/config.yaml"
          # FILEBROWSER_DATABASE: "/database/filebrowser.sqlite"
          FILEBROWSER_DEVMODE: true 
          FILEBROWSER_ADMIN_PASSWORD: 
            valueFrom:
              secretKeyRef:
                name: default-secret
                key: password
          # FILEBROWSER_ONLYOFFICE_SECRET: 
          # FILEBROWSER_FFMPEG_PATH: 
          FILEBROWSER_OIDC_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: filebrowser-secret
                key: oidcClient
          FILEBROWSER_OIDC_CLIENT_SECRET: 
            valueFrom:
              secretKeyRef:
                name: filebrowser-secret
                key: oidcSecret
          FILEBROWSER_ONLYOFFICE_SECRET:
            valueFrom:
              secretKeyRef:
                name: onlyoffice-secret
                key: token

          # FILEBROWSER_JWT_TOKEN_SECRET: 
          # FILEBROWSER_TOTP_SECRET: 
          # FILEBROWSER_RECAPTCHA_SECRET: 

configMaps:
  config:
    enabled: true
    data: 
      config.yaml: |
        # Generated by FileBrowser Quantum config migration tool
        # Database values are placeholders, ensure file names match what you expect.
        server:
          database:
            path: "/database/filebrowser.sqlite"
          logging:
            - levels: "debug|info|warning|error"
            - apiLevels: "debug|info|warning|error"
          sources:
            - path: "/jeantasse"
              config:
                defaultEnabled: true
                createUserDir: false
                defaultUserScope: "/Loisir"
                defaultPermissions:
                  view: true
                  modify: false
                  create: false
                  delete: false
                  download: true
        http:
          port: 80
          baseURL: "/"
          externalUrl: "https://cloud.dartus.fr:443/"
          internalUrl: "http://filebrowser.default.svc.cluster.local/"
          trustProxyHeaders: true
        auth:
          methods:
            proxy:
              enabled: false
              createUser: false
              header: ""
              logoutRedirectUrl: ""
            noauth: false
            password:
              enabled: true
              minLength: 5
              signup: false
              enforcedOtp: false
            oidc:
              enabled: true
              issuerUrl: "https://authentik.dartus.fr/application/o/filebrowser/"
              scopes: "openid email profile"
              userIdentifier: "preferred_username"
              disableVerifyTLS: true
              createUser: true
              adminGroup: "authentik Admins"
              groupsClaim: "groups"
          adminUsername: "admin"
        userDefaults:
          sidebar:
            disableQuickToggles: false
            hideFileActions: false
            sticky: true
            disableHideOnPreview: true
          listing:
            deleteWithoutConfirming: false
            dateFormat: false
            showHidden: false
            quickDownload: false
            showSelectMultiple: false
            singleClick: false
            viewMode: "normal"
            gallerySize: 3
          search:
            disableOptions: false
          fileViewer:
            editorQuickSave: false
            disableViewingExt: ""
            disableOnlyOfficeExt: ".md .txt .pdf"
            autoplayMedia: false
            # defaultMediaPlayer: true
          ui:
            darkMode: true
            themeColor: "var(--blue)"
          account:
            lockPassword: false
            disableSettings: false
            disableUpdateNotifications: false
            permissions:
              admin: false
              api: false
              share: false
              realtime: false
        integrations:
          office:
            url: "https://onlyoffice.dartus.fr:443"
            internalUrl: "http://onlyoffice.default.svc.cluster.local/"

service:
  main:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 80
        protocol: HTTP

ingress: 
  main:
    enabled: true
    annotations:
      hajimari.io/enable: "true"
      hajimari.io/group: "Media"
      hajimari.io/icon: "cloud-download"
      # traefik.ingress.kubernetes.io/router.middlewares: "network-authentik-forward-auth@kubernetescrd"
      cert-manager.io/cluster-issuer: zerossl-prod
      # traefik.ingress.kubernetes.io/router.middlewares: network-crowdsec@kubernetescrd
      acme.cert-manager.io/http01-edit-in-place: "true"
    hosts:
      - # -- Host address. Helm template can be passed.
        host: cloud.dartus.fr
        paths:
          - # -- Path.  Helm template can be passed.
            path: /
            pathType: Prefix
            service:
              identifier: main
              port: http              
    tls:
      - hosts:
        - cloud.dartus.fr
        secretName: cloud.dartus.fr-tls

persistence: 
  data:
    enabled: true
    type : persistentVolumeClaim
    existingClaim: pvc-all
    globalMounts:
      - path: /jeantasse
        readOnly: false
  config:
    enabled: true
    type: configMap
    identifier: config
  database:
    enabled: true
    type : persistentVolumeClaim
    existingClaim: pvc-db
    globalMounts:
      - path: /database
        readOnly: false