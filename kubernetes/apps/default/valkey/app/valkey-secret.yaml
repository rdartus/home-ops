# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/secrets.hashicorp.com/vaultstaticsecret_v1beta1.json
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-kv-valkey
  namespace: default
  

spec:
  type: kv-v2
  mount: kv-v2
  path: redis/config
  destination:
    name: valkey-secret
    create: true
  refreshAfter: 30s
  vaultAuthRef: valkey-auth