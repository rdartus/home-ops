---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/secrets.hashicorp.com/vaultstaticsecret_v1beta1.json
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-kv-dawarich-redis
  namespace: default
spec:
  type: kv-v2
  mount: kv-v2
  path: redis/config
  destination:
    name: dawarich-redis
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*" # ne recopie pas la clé "password" brute du Valkey partagé dans ce Secret
      templates:
        REDIS_URL:
          # dans les templates VSO les données Vault sont sous .Secrets (pas à la racine)
          text: 'redis://:{{ .Secrets.password | urlquery }}@valkey.default.svc.cluster.local:6379/1'
  refreshAfter: 30s
  vaultAuthRef: dawarich-auth
  rolloutRestartTargets:
    - kind: StatefulSet
      name: dawarich-web
    - kind: StatefulSet
      name: dawarich-sidekiq
