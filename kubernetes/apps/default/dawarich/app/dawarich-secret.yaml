---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/secrets.hashicorp.com/vaultstaticsecret_v1beta1.json
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-kv-dawarich
  namespace: default
spec:
  type: kv-v2
  mount: kv-v2
  path: dawarich/config
  destination:
    name: dawarich-config
    create: true
  transformation:
    excludeRaw: true
  refreshAfter: 30s
  vaultAuthRef: dawarich-auth
  # Les StatefulSets générés par app-template s'appellent <release>-<controller>.
  # Pas la base : changer db_password dans Vault ne change pas le mot de passe déjà initialisé dans Postgres.
  rolloutRestartTargets:
    - kind: StatefulSet
      name: dawarich-web
    - kind: StatefulSet
      name: dawarich-sidekiq
