# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/secrets.hashicorp.com/vaultstaticsecret_v1beta1.json
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-kv-immich-redis
  namespace: default
  

spec:
  type: kv-v2
  mount: kv-v2
  path: redis/config
  destination:
    name: immich-redis-secret
    create: true
    transformation:
        excludeRaw: true   # Empêche l'inclusion des champs bruts de Vault
        excludes:
          - ".*"           # Exclut explicitement tous les champs natifs du secret source
        templates:
          REDIS_URL:
            text: 'ioredis://{{ dict "host" "valkey.default.svc.cluster.local" "port" 6379 "username" "default" "password" .Secrets.password "db" 0 | toJson | b64enc }}'  
  refreshAfter: 30s
  vaultAuthRef: immich-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: immich-server