# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---
controllers:
  main:
    enabled: true
    type: statefulset
    containers:
      main:
        image:
          repository: ghcr.io/mealie-recipes/mealie
          tag: v3.29.0@sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc
          pullPolicy: IfNotPresent
        env:
          BASE_URL: https://mealie.dartus.fr
          ALLOW_SIGNUP: "false"
          PUID: 1000
          PGID: 1000
          TZ: Europe/Paris
          DEFAULT_GROUP: Nourir les Dragons
          # Database Settings
          POSTGRES_SERVER: cnpg-cluster-rw.database.svc.cluster.local
          POSTGRES_PORT: 5432
          POSTGRES_DB: mealie
          DB_ENGINE: postgres
          POSTGRES_USER: 
            valueFrom:
              secretKeyRef:
                name: chef-db-secret
                key: username
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: chef-db-secret
                key: password
          # OIDC Settings
          OIDC_AUTH_ENABLED: true
          OIDC_SIGNUP_ENABLED: true
          OIDC_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: mealie-secret
                key: oidcClient
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: mealie-secret
                key: oidcSecret
          OIDC_ADMIN_GROUP: authentik Admins
          OIDC_PROVIDER_NAME: Authentik
          OIDC_CONFIGURATION_URL: https://authentik.dartus.fr/application/o/mealie/.well-known/openid-configuration
          OIDC_AUTO_REDIRECT: true
          OIDC_REMEMBER_ME: true
          # OIDC_USER_GROUP: Pecor
          # SMTP Settings
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_FROM_NAME: "Mealie"
          SMTP_AUTH_STRATEGY: TLS
          SMTP_FROM_EMAIL: 
            valueFrom:
              secretKeyRef:
                name: smtp-secret
                key: gmail_username
          SMTP_USER: 
            valueFrom:
              secretKeyRef:
                name: smtp-secret
                key: gmail_username
          SMTP_PASSWORD: 
            valueFrom:
              secretKeyRef:
                name: smtp-secret
                key: gmail_password

service:
  main:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 9000
        protocol: HTTP
ingress: 
  main:
    enabled: true
    annotations:
      hajimari.io/enable: "true"
      hajimari.io/group: "Media"
      hajimari.io/icon: "chef-hat"
      cert-manager.io/cluster-issuer: zerossl-prod
      # traefik.ingress.kubernetes.io/router.middlewares: network-crowdsec@kubernetescrd
      acme.cert-manager.io/http01-edit-in-place: "true"
    hosts:
      - # -- Host address. Helm template can be passed.
        host: mealie.dartus.fr
        paths:
          - # -- Path.  Helm template can be passed.
            path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
        - mealie.dartus.fr
        secretName: mealie.dartus.fr-tls

route:
  main:
    enabled: false
    kind: HTTPRoute
    annotations:
    labels: {}
    parentRefs:
      - # Group of the referent resource.
        group: gateway.networking.k8s.io
        kind: Gateway
        name: traefik-gateway
        namespace: network
        sectionName: websecure-mealie
    hostnames: 
      - mealie.dartus.fr
    rules:
      - # -- Configure backends where matching requests should be sent.
        backendRefs: 
          - name: mealie
            port: 9000
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: pvc-mealie-media
    globalMounts:
      - path: /app/data/
