# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json

---
controllers:
  main:
    enabled: true
    type: statefulset
    containers:
      main:
        dependsOn: []
        image:
          repository: linuxserver/calibre-web
          tag: 0.6.27@sha256:470b4ed9a7d6ea1475fef17dbcf957cb60880910296d226bd0dca652c05f68ca
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
          PUID: "1001"
          PGID: "1001"

service:
  main:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 8083
        protocol: HTTP
ingress:
  main:
    enabled: true
    annotations:
      hajimari.io/enable: "true"
      hajimari.io/group: "Media"
      hajimari.io/icon: "bookshelf"
      hajimari.io/appName: "livres"
      traefik.ingress.kubernetes.io/router.middlewares: "network-authentik-forward-auth@kubernetescrd"
      cert-manager.io/cluster-issuer: zerossl-prod
      # traefik.ingress.kubernetes.io/router.middlewares: network-crowdsec@kubernetescrd
      acme.cert-manager.io/http01-edit-in-place: "false"

    hosts:
      -  # -- Host address. Helm template can be passed.
        host: books.dartus.fr
        paths:
          -  # -- Path.  Helm template can be passed.
            path: /
            pathType: Prefix
            service:
              identifier: main
              port: http              

    tls:
      - hosts:
        - books.dartus.fr
        secretName: books.dartus.fr-tls


persistence: 
  loisir:
    enabled: true
    type : persistentVolumeClaim
    existingClaim: pvc-jeantasse-loisir
    globalMounts:
      - path: /books
        subPath: Books/Calibre-EN
        readOnly: false

  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: pvc-books-conf